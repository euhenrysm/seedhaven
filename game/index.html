<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Seedhaven prototype — Build, grow and trade." />
  <title>Seedhaven — Prototype v0.1</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div>
        <h1>Seedhaven</h1>
        <p>Build, grow and trade.</p>
      </div>
      <span class="version">Prototype v0.1</span>
    </header>

    <section class="game-card">
      <div id="game"></div>
    </section>

    <p class="hint">
      Tip: follow the tutorial objective at the bottom of the game. The first crop takes 30 seconds after watering.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./game.js"></script>
</body>
</html>
